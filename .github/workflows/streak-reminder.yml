name: LeetCode Streak Reminder

on:
  schedule:
    - cron: "54 15 * * *"
    - cron: "57 16 * * *"
  workflow_dispatch:

jobs:
  check-streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Determine time slot
        id: slot
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "15" ]; then
            echo "slot=9:24pm" >> "$GITHUB_OUTPUT"
          else
            echo "slot=10:27pm" >> "$GITHUB_OUTPUT"
          fi

      - name: Check streak and notify
        env:
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_streak.py "${{ steps.slot.outputs.slot }}"
